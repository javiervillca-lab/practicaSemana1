<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva venta</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/nueva-venta.css">
</head>
<body>
    <main class="sale-form-container">
        <div class="page-heading">
            <div>
                <h1>Registrar nueva venta</h1>
                <p class="intro">Selecciona un producto del catálogo y registra la operación.</p>
            </div>
            <a class="back-link" href="ventas.html">Volver al registro</a>
        </div>

        <form action="ventas.html" method="get">
            <div class="form-group form-group-wide">
                <label for="producto">Producto</label>
                <select id="producto" name="producto" required>
                    <option value="" selected disabled>Selecciona un producto</option>
                    <option value="Camiseta básica" data-category="Ropa" data-price="250">Camiseta básica - Bs. 250</option>
                    <option value="Sudadera con capucha" data-category="Ropa" data-price="650">Sudadera con capucha - Bs. 650</option>
                    <option value="Jeans clásicos" data-category="Ropa" data-price="800">Jeans clásicos - Bs. 800</option>
                    <option value="Tenis deportivos" data-category="Tenis" data-price="1200">Tenis deportivos - Bs. 1,200</option>
                    <option value="Tenis casuales" data-category="Tenis" data-price="950">Tenis casuales - Bs. 950</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de venta</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad" min="1" step="1" placeholder="1" required>
            </div>

            <div class="form-group">
                <label for="cliente">Cliente</label>
                <input type="text" id="cliente" name="cliente" placeholder="Nombre del cliente" required>
            </div>

            <div class="form-group">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required>
                    <option value="Completada">Completada</option>
                    <option value="Pendiente">Pendiente</option>
                </select>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary" href="ventas.html">Cancelar</a>
                <button class="btn btn-primary" type="submit">Guardar venta</button>
            </div>
        </form>
    </main>
</body>
</html>

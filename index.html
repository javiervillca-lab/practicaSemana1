<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas - Tienda de Ropa</title>
    <link rel="stylesheet" href="styles/menu.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL EN REJILLA -->
    <div class="grid-container">
        
        <!-- MENÚ LATERAL IZQUIERDO (SIDEBAR) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>SISVEN</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="productos.html" target="productos" class="active">Inventario / Productos</a>
                <a href="ventas.html" target="productos">Ventas</a>
                <a href="#">Clientes</a>
                <a href="login.html">Salir</a>
            </nav>
        </aside>

        <!-- CONTENIDO DE LA DERECHA (ENCABEZADO, CUERPO Y PIE) -->
        <div class="main-layout">
            
            <!-- ENCABEZADO -->
            <header class="header">
                <div class="header-title">
                    <h1>Panel de Inventario de Ropa</h1>
                    <p>Gestiona tus prendas, stock y precios</p>
                </div>
            </header>

            <!-- CUERPO DE LA PÁGINA (PRODUCTOS) -->
            <main class="content">
                  <iframe name="productos" src="productos.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </main>

            <!-- PIE DE PÁGINA -->
            <footer class="footer">
                <p>UCB V1.0 &copy; 2026 - Practica 1 </p>
            </footer>

        </div>
    </div>

</body>
</html>

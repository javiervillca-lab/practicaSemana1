<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar producto</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/agregar-producto.css">
</head>
<body>
    <main class="product-form-container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Inventario</p>
                <h1>Agregar producto</h1>
                <p class="intro">Registra una nueva prenda o par de tenis en el catálogo.</p>
            </div>
            <a class="back-link" href="productos.html">Volver a productos</a>
        </div>

        <form class="product-form" action="productos.html" method="get">
            <div class="form-group form-group-wide">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Camiseta básica" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                    <option value="" selected disabled>Selecciona una categoría</option>
                    <option value="Ropa">Ropa</option>
                    <option value="Tenis">Tenis</option>
                </select>
            </div>

            <div class="form-group">
                <label for="talla">Talla</label>
                <input type="text" id="talla" name="talla" placeholder="Ej. M o 27" required>
            </div>

            <div class="form-group">
                <label for="color">Color</label>
                <input type="text" id="color" name="color" placeholder="Ej. Blanco" required>
            </div>

            <div class="form-group">
                <label for="precio">Precio (Bs.)</label>
                <input type="number" id="precio" name="precio" min="0.01" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="stock">Stock disponible</label>
                <input type="number" id="stock" name="stock" min="0" step="1" placeholder="0" required>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary" href="productos.html">Cancelar</a>
                <button class="btn btn-primary" type="submit">Guardar producto</button>
            </div>
        </form>
    </main>
</body>
</html>
